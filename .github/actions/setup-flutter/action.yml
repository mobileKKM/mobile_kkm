name: Set up Flutter
description: Java 17 and the pinned Flutter SDK, then `flutter pub get` for the whole workspace.

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    # Keep on the Flutter version releases are built with, the same as `srclibs: flutter@…` in
    # tool/fdroid/de.codebucket.mkkm.yml.
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.47.5
        channel: stable
        cache: true

    - name: Get packages
      shell: bash
      run: |
        flutter config --no-analytics
        flutter pub get
