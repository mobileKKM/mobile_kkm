# Draft of metadata/de.codebucket.mkkm.yml for the merge request to
# https://gitlab.com/fdroid/fdroiddata. The copy there is the one F-Droid uses;
# keep this one in step with it. Store texts and images come from
# fastlane/metadata/android/ in this repository.
#
# Per release: tag the commit vX.Y.Z (UpdateCheckMode reads the tags). The build
# follows fdroiddata's templates/build-flutter.yml: srclib flutter@stable, checked
# out at the `flutter-version` of .github/actions/setup-flutter/action.yml.
#
# Betas (vX.Y.Z-beta.N) are not matched by UpdateCheckMode on purpose: auto-update would make them
# the recommended version. Add their build entries by hand and leave CurrentVersion(Code) on the
# last stable release, so they only reach users with "Unstable updates" on.
Categories:
  - Pass Wallet
  - Public Transport
License: GPL-3.0-or-later
AuthorName: David Sn
WebSite: https://mobilekkm.app
SourceCode: https://github.com/mobileKKM/mobile_kkm
IssueTracker: https://github.com/mobileKKM/mobile_kkm/issues
Changelog: https://github.com/mobileKKM/mobile_kkm/releases
Donate: https://www.paypal.me/divadsn

AutoName: mobileKKM

AntiFeatures:
  NonFreeNet:
    en-US: Relies on the proprietary eKP ticketing service of ZTP / MPK Kraków.
    pl: Korzysta z zamkniętego systemu biletowego eKP ZTP / MPK Kraków.

# Reproducible build: F-Droid rebuilds the APK, copies the signature of this release file onto it and
# publishes the result only if it matches byte for byte (checked with apksigcopier against v2.0.0-beta.1).
Binaries: https://github.com/mobileKKM/mobile_kkm/releases/download/v%v/mobileKKM-%v-foss.apk
AllowedAPKSigningKeys: 472ca482b13ee2a71d3683cddbede921dfcba0b650e6d9360d2507e950b4fe04

RepoType: git
Repo: https://github.com/mobileKKM/mobile_kkm.git

Builds:
  - versionName: 2.0.0-beta.1
    versionCode: 24
    commit: 4ad762ee32ac4b829be1e5f882f1940ebcecf1b8
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    # maplibre_gl compiles its Java for 21; the build server's default JDK is older.
    sudo:
      - apt-get update
      - apt-get install -y openjdk-21-jdk-headless
      - update-java-alternatives -a
      # Flutter embeds the build directory and the Android SDK path in the native libraries. release.yml builds
      # on GitHub's runner, so build here at the same two paths (SDK: F-Droid's /opt/android-sdk, linked).
      - mkdir -p /home/runner/work/mobile_kkm
      - chown -R vagrant:vagrant /home/runner
      - mkdir -p /usr/local/lib/android
      - ln -s /opt/android-sdk /usr/local/lib/android/sdk
    rm:
      - ios
    prebuild:
      - flutterVersion=$(sed -n -E "s/^[[:space:]]*flutter-version:[[:space:]]*'?([0-9.]+)'?[[:space:]]*$/\1/p"
        .github/actions/setup-flutter/action.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      # The release build falls back to the debug key without android/key.properties; F-Droid signs it itself.
      - sed -i -e '/signingConfig = /d' android/app/build.gradle.kts
      # pub get at GitHub's checkout path (package_config.json holds absolute paths).
      - export repo=/home/runner/work/mobile_kkm/mobile_kkm
      - cd ..
      - mv de.codebucket.mkkm $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter config --android-sdk /usr/local/lib/android/sdk
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - sh tool/fdroid/strip_gms.sh
      - popd
      - mv $repo de.codebucket.mkkm
    scandelete:
      - .pub-cache
    build:
      # As release.yml builds it (APK, no dart defines): ARM only, Dart debug info left out.
      - export repo=/home/runner/work/mobile_kkm/mobile_kkm
      - cd ..
      - mv de.codebucket.mkkm $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export ANDROID_HOME=/usr/local/lib/android/sdk ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
      - $$flutter$$/bin/flutter build apk --release --target-platform android-arm,android-arm64 --split-debug-info=build/symbols
      - popd
      - mv $repo de.codebucket.mkkm

# No stable tag yet, so checkupdates would fail. With 2.0.0:
#   AutoUpdateMode: Version
#   UpdateCheckMode: Tags ^v[0-9.]+$
#   UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
AutoUpdateMode: None
UpdateCheckMode: None
CurrentVersion: 2.0.0-beta.1
CurrentVersionCode: 24
