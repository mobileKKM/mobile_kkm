name: ekp_crypto
description: >-
  Crypto helpers for the mKKM (EKP) encrypted endpoints: RSA-wrapped request
  payloads for assign-e/contract-e and AES-128-CBC AZTEC contract decryption.
  Reverse-engineered from the official Android client for interoperability.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.13.4

# Member of the repository-root pub workspace; dependencies resolve against
# the shared root solve when developed inside the repo.
resolution: workspace

dependencies:
  asn1lib: ^1.6.5
  pointycastle: ^4.0.0

dev_dependencies:
  coverage: ^1.15.1
  lints: ^6.0.0
  test: ^1.25.8
