name: ekp_api
description: Unofficial Dart client for the EKP (mKKM) API of ZTP / MPK Kraków.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.13.4

# Member of the repository-root pub workspace; dependencies resolve against
# the shared root solve when developed inside the repo.
resolution: workspace

dependencies:
  # Crypto for the encrypted mkkm endpoints (assign-e / contract-e).
  ekp_crypto:
    path: ../ekp_crypto
  cookie_jar: ^4.0.0
  dio: ^5.7.0
  dio_cookie_manager: ^3.5.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  meta: ^1.16.0

dev_dependencies:
  build_runner: ^2.16.1
  coverage: ^1.15.1
  freezed: ^4.0.0
  json_serializable: ^6.14.0
  lints: ^6.0.0
  test: ^1.25.8
