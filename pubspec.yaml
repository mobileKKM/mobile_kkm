name: mobile_kkm
description: "Unofficial FOSS client for the mKKM / EKP system of ZTP / MPK Kraków."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.4

# Pub workspace: the app and the packages below share a single dependency
# resolution (one `flutter pub get`, one lockfile, one analysis context).
# Members must declare `resolution: workspace`. See dart.dev/tools/pub/workspaces.
workspace:
  - packages/ekp_api
  - packages/ekp_crypto

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  barcode_widget: ^2.0.4
  cached_network_image: ^4.0.4
  cupertino_icons: ^1.0.8
  device_info_plus: ^13.3.0
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  ekp_api:
    path: packages/ekp_api
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.5
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  geolocator: ^14.1.1
  go_router: ^18.0.2
  intl: ^0.20.3
  maplibre_gl: ^0.27.1
  material_symbols_icons: ^4.2960.0
  material_ui: ^1.5.0
  no_screenshot: ^2.0.1
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  url_launcher: ^6.3.3

dev_dependencies:
  build_runner: ^2.16.1
  dio: ^5.11.1
  drift_dev: ^2.35.1
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  riverpod_lint: ^3.1.9

flutter:
  uses-material-design: true

  # Generates AppLocalizations from lib/l10n/*.arb (see l10n.yaml).
  generate: true

  assets:
    - assets/images/
    # Licence texts of the bundled fonts, registered with LicenseRegistry.
    - assets/fonts/Montserrat-OFL.txt
    - assets/fonts/Inter-OFL.txt

  # Static weights (not variable files) so FontWeight maps 1:1 to a file.
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

# Native splash. Regenerate: `dart run flutter_native_splash:create`.
# Colours must match SplashScreen in lib/features/splash/screens/splash_screen.dart.
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#121318"
  image: assets/images/splash_logo.png
  image_dark: assets/images/splash_logo.png
  android_12:
    color: "#FFFFFF"
    color_dark: "#121318"
    image: assets/branding/splash_android12.png
    image_dark: assets/branding/splash_android12.png
