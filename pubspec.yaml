name: mobile_kkm
description: "Unofficial FOSS client for the mKKM / EKP system of ZTP / MPK Kraków."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.4

# Pub workspace: the app and the packages below share a single dependency
# resolution (one `flutter pub get`, one lockfile, one analysis context).
# Members must declare `resolution: workspace`. See dart.dev/tools/pub/workspaces.
workspace:
  - packages/ekp_api
  - packages/ekp_crypto

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  flutter_secure_storage: ^11.2.0
  device_info_plus: ^13.3.0
  url_launcher: ^6.3.3
  flutter_svg: ^2.3.0
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter
  ekp_api:
    path: packages/ekp_api

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  dio: ^5.11.1

flutter:
  uses-material-design: true

  # Generates AppLocalizations from lib/l10n/*.arb (see l10n.yaml).
  generate: true

  assets:
    - assets/images/
    # Licence texts of the bundled fonts, registered with LicenseRegistry.
    - assets/fonts/Montserrat-OFL.txt
    - assets/fonts/Inter-OFL.txt

  # Static weights (not variable files) so FontWeight maps 1:1 to a file.
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

# Launcher icons — sources are rendered from assets/branding/*.svg by
# assets/branding/render.sh. Regenerate: `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/icon.png
  adaptive_icon_background: "#303F9F"
  adaptive_icon_foreground: assets/branding/icon_fg.png
  # The foreground already covers the full 108dp adaptive canvas.
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
  min_sdk_android: 24

# Native splash. Regenerate: `dart run flutter_native_splash:create`.
# Colours must match SplashScreen in lib/features/splash/screens/splash_screen.dart.
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#121318"
  image: assets/images/splash_logo.png
  image_dark: assets/images/splash_logo.png
  android_12:
    color: "#FFFFFF"
    color_dark: "#121318"
    image: assets/branding/splash_android12.png
    image_dark: assets/branding/splash_android12.png
