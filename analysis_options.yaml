include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - lib/l10n/app_localizations*.dart

# Riverpod-specific lints and assists (the riverpod_lint dev dependency).
# Only `dart analyze` and the IDE run plugins; `flutter analyze` does not.
plugins:
  riverpod_lint: ^3.1.9

formatter:
  page_width: 120

linter:
  rules:
    # Files move between feature folders; package imports survive that.
    always_use_package_imports: true
    directives_ordering: true
    sort_pub_dependencies: true

    # Cheaper widgets for the same result.
    sized_box_shrink_expand: true
    use_colored_box: true
    use_decorated_box: true
